<!DOCTYPE html>
<html lang="tr">
<head>

    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">

    <link rel="manifest" href="site.webmanifest">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #fafcfa; color: #1e2a1e; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .box { text-align: center; max-width: 500px; }
        .logo-404 { width: 130px; height: 130px; border-radius: 50%; overflow: hidden; border: 3px solid #1a1a5c; background: white; margin: 0 auto 24px; box-shadow: 0 10px 30px rgba(26,26,92,0.2); padding: 0; display: flex; align-items: center; justify-content: center; }
        .logo-404 img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; transform: scale(1.2); }
        h1 { font-size: 90px; color: #0f6b32; font-weight: 800; line-height: 1; margin-bottom: 6px; letter-spacing: -2px; }
        h2 { font-size: 24px; color: #0a4a22; margin-bottom: 16px; }
        p { color: #4a6b4a; font-size: 16px; margin-bottom: 30px; line-height: 1.6; }
        .btn { display: inline-block; background: #0f6b32; color: white; padding: 16px 36px; border-radius: 60px; font-weight: 700; font-size: 17px; text-decoration: none; box-shadow: 0 6px 0 #0a4a22; transition: 0.15s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #0a4a22; }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0a4a22; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo-404"><img src="favicon-source.png" alt="Ramiz Köfte" /></div>
        <h1>404</h1>

        <p>Sayfa taşınmış, silinmiş ya da hiç var olmamış olabilir. Anasayfaya dönüp menümüze göz atabilirsiniz.</p>
        <a href="index.html" class="btn">🍽️ Anasayfaya Dön</a>
    </div>
</body>
</html>
